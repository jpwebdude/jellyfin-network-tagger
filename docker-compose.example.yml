# ─── Jellyfin Network Tagger — Docker Compose Example ───────────────────────
#
# Complete Compose configuration for the web dashboard on port 3000.
# All settings (TMDB, Jellyfin, schedule, local paths) are configured in the
# dashboard's Settings page and persisted in the mounted /app/data volume.
# ─────────────────────────────────────────────────────────────────────────────

services:
  jellyfin-network-tagger:
    # Option A (Recommended): Pre-built multi-arch image from GHCR
    image: ghcr.io/jpwebdude/jellyfin-network-tagger:latest
    # Option B: Docker Hub image
    # image: jhosted/jellyfin-network-tagger:latest
    # Option C: Build locally from source
    # build: .

    container_name: jellyfin-network-tagger
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      # Persists dashboard Settings across container restarts and updates
      - ./config:/app/data
      # Optional: Mount local media folders for the Local Library Tagger
      # - /path/to/your/movies:/media/movies
      # - /path/to/your/tv:/media/tv
    # Optional: Pre-seed initial settings via .env on first boot
    # env_file:
    #   - .env
    networks:
      - media-stack_default

networks:
  media-stack_default:
    external: true
